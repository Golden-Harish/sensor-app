CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LOG=y
CONFIG_SHELL=y


CONFIG_I2C_SHELL=y           # Enable I2C shell for debugging

# Optional: If using a specific sensor (e.g., TMP117, BME280, etc.)
CONFIG_TMAG5273=y              # Enable a specific I2C sensor (example)
CONFIG_SENSOR_SHELL=y        # Enable sensor shell for debugging sensors
CONFIG_LOG_DEFAULT_LEVEL=3
